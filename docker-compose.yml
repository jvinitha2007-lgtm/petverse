services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petverse
      POSTGRES_USER: petverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petverse-local-only}
    ports:
      - "5432:5432"
    volumes:
      - petverse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petverse -d petverse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  petverse-postgres:
